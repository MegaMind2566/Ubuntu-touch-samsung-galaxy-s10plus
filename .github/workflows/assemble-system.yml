name: S10+ Ubuntu Touch 24.04 system candidate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/assemble_system.py'
      - 'scripts/validate_system.py'
      - 'docs/assembly-inputs-2026-10-12.json'
      - 'docs/device-check-2026-10-12.json'
      - '.github/workflows/assemble-system.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: system-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install image assembly dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs fakeroot git img2simg python3 wget xz-utils zstd
      - name: Retrieve the verified first Halium 12 adaptation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38301613434
          name: beyond2lte-halium12-1
          path: build/inputs/adaptation
      - name: Validate inventory and image rejection cases
        run: python3 -m unittest discover -s tests -v
      - name: Assemble and validate the non-flashing system candidate
        run: |
          mkdir -p out
          set -o pipefail
          python3 scripts/assemble_system.py --adaptation build/inputs/adaptation 2>&1 | tee out/system-assembly.log
      - name: Save image and validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beyond2lte-ubuntu24-system-${{ github.run_number }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            out/system-assembly.log
            out/system-candidate/*.json
            out/system-candidate/SHA256SUMS
            out/system-candidate/boot.img
            out/system-candidate/rootfs.img.zst
