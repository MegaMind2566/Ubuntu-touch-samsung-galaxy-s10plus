name: S10+ verified-release graphics candidate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/assemble_system.py'
      - 'scripts/validate_system.py'
      - 'scripts/graphics_assembly.py'
      - 'scripts/build-resume-system.py'
      - 'tests/test_graphics_assembly.py'
      - 'tests/test_resume_system.py'
      - 'tools/graphics-permissions/99-ubuntu-touch-s10plus-graphics.rules'
      - 'config/releases/v0.1.0-alpha.1.json'
      - '.gitattributes'
      - '.github/workflows/assemble-system.yml'
permissions:
  contents: read
concurrency:
  group: system-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  derive:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install image validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl e2fsprogs git python3 xz-utils zstd
      - name: Verify source and rejection cases on Linux
        run: python3 -m unittest discover -s tests -v
      - name: Download the immutable public release inputs
        run: |
          mkdir -p build/inputs out
          curl --fail --location --retry 3 --output build/inputs/SYSTEM.img.zst \
            https://github.com/MegaMind2566/Ubuntu-touch-samsung-galaxy-s10plus/releases/download/v0.1.0-alpha.1/SYSTEM.img.zst
          curl --fail --location --retry 3 --output build/inputs/boot-tools.zip \
            https://github.com/MegaMind2566/Ubuntu-touch-samsung-galaxy-s10plus/releases/download/v0.1.0-alpha.1/UbuntuTouch-S10plus-v0.1.0-alpha.1-boot-and-tools-Windows.zip
      - name: Derive and validate a non-flashing SYSTEM candidate with exact BOOT 6
        run: |
          set -o pipefail
          python3 scripts/build-resume-system.py \
            --system-zstd build/inputs/SYSTEM.img.zst \
            --boot-tools build/inputs/boot-tools.zip \
            --output out/resume-system-candidate 2>&1 | tee out/resume-system-build.log
      - name: Split the verified export for connector download
        run: |
          cd out/resume-system-candidate
          split -b 384M SYSTEM-graphics-candidate.img.zst SYSTEM.img.zst.part-
          test ! -e SYSTEM.img.zst.part-ad
          sha256sum SYSTEM.img.zst.part-* > CHUNK_SHA256SUMS
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beyond2lte-resume-diagnostics-${{ github.run_number }}
          retention-days: 14
          path: |
            out/resume-system-build.log
            out/resume-system-candidate/*.json
            out/resume-system-candidate/SHA256SUMS
            out/resume-system-candidate/CHUNK_SHA256SUMS
      - name: Save candidate part 1 and BOOT 6
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beyond2lte-resume-part-1-${{ github.run_number }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            out/resume-system-candidate/BOOT6.img
            out/resume-system-candidate/SYSTEM.img.zst.part-aa
      - name: Save candidate part 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beyond2lte-resume-part-2-${{ github.run_number }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: out/resume-system-candidate/SYSTEM.img.zst.part-ab
      - name: Save candidate part 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beyond2lte-resume-part-3-${{ github.run_number }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: out/resume-system-candidate/SYSTEM.img.zst.part-ac
