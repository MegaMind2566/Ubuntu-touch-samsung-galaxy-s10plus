name: Upstream checkout validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-upstream.sh'
      - 'scripts/fetch_sources.py'
      - 'config/upstream.lock.json'
      - 'scripts/validate-artifacts.py'
      - 'tests/**'
      - 'scripts/collect-device.ps1'
      - 'scripts/launch-device-check.ps1'
      - 'AVVIA-CONTROLLO.cmd'
      - '.github/workflows/upstream-checkout.yml'
jobs:
  checkout:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned checkout and artifact rejection cases
        run: python3 -m unittest discover -s tests -v
      - name: Fetch original UBports source
        run: bash scripts/fetch-upstream.sh
      - name: Inspect S10+ device config
        run: |
          cat upstream/samsung-exynos9820/deviceinfo-beyond2lte
          git -C upstream/samsung-exynos9820 log -1 --oneline
      - uses: actions/upload-artifact@v4
        with:
          name: beyond2lte-upstream-revision
          path: |
            upstream/upstream-revision.txt
            upstream/source-manifest.json
  device-inventory-script:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate Windows inventory script using mock ADB
        shell: powershell
        run: ./tests/test-device-collector.ps1
      - name: Validate launcher with official ADB and Windows PowerShell 5.1
        shell: powershell
        run: ./tests/test-device-launcher.ps1
