name: S10+ SAR init handoff BOOT update
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/install-boot-update-2.ps1.in'
      - 'scripts/verify_boot_update_2.py.in'
      - 'scripts/package-boot-update-2.py'
      - 'scripts/fetch_boot_update_2_artifacts.py'
      - 'tests/test-boot-update-2.ps1'
      - 'tools/windows/INSTALLA-CORREZIONE-AVVIO.cmd'
      - 'tools/windows/RIPRISTINA-BOOT-1.cmd'
      - 'tools/windows/LEGGIMI-CORREZIONE-AVVIO.txt'
      - '.github/workflows/boot-update-2.yml'
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Obtain immutable original, version 1 and corrected handoff builds
        shell: powershell
        env:
          UT_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python scripts/prepare_boot_update.py inputs --out out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/fetch_boot_update_2_artifacts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package the handoff fix, previous BOOT and pinned portable runtime
        shell: powershell
        run: |
          python scripts/package-ubuntu-install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-boot-update-2.py --build-archive out/corrected-adaptation-2.zip --previous-archive out/previous-adaptation.zip --baseline-boot out/boot-baseline/boot.img
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract the add-on into existing tools with a path containing spaces
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root=[IO.Path]::GetFullPath('out/BOOT handoff with spaces')
          [IO.Compression.ZipFile]::ExtractToDirectory([IO.Path]::GetFullPath('out/UbuntuTouch-S10plus-installa-Ubuntu-Windows.zip'),$root)
          $zip=[IO.Compression.ZipFile]::OpenRead([IO.Path]::GetFullPath('out/UbuntuTouch-S10plus-correzione-AVVIO-Windows.zip'))
          try {
            foreach ($entry in $zip.Entries) {
              $destination=Join-Path $root $entry.FullName
              [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($destination)) | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,$destination,$true)
            }
          } finally { $zip.Dispose() }
      - name: Test actual BOOT pins, versioned guards, rollback and both native CMDs
        shell: powershell
        run: .\tests\test-boot-update-2.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beyond2lte-boot-handoff-windows
          path: |
            out/UbuntuTouch-S10plus-correzione-AVVIO-Windows.zip
            out/boot-update-2-artifact-references.json
          if-no-files-found: error
