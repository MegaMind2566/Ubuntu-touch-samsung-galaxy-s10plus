name: S10+ host-only USB boot evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check-boot-usb.ps1'
      - 'scripts/package-boot-usb-check.py'
      - 'tests/test-boot-usb.ps1'
      - 'tests/test_boot_usb_native.py'
      - 'tools/windows/CONTROLLA-USB-AVVIO.cmd'
      - 'tools/windows/LEGGIMI-USB-AVVIO.txt'
      - '.github/workflows/boot-usb-check.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Package the host-only collector
        run: python scripts/package-boot-usb-check.py
      - name: Verify USB filters and serial omission on Windows 5.1
        shell: powershell
        run: .\tests\test-boot-usb.ps1
      - name: Run real PnP and CIM queries through the native CMD
        run: python tests/test_boot_usb_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beyond2lte-boot-usb-check-tools
          path: out/UbuntuTouch-S10plus-controllo-USB-avvio-Windows.zip
          if-no-files-found: error
