name: S10+ package validated Ubuntu BOOT
on:
  workflow_dispatch:
  push:
    paths:
      - '.gitattributes'
      - 'scripts/repackage_ubuntu_boot_handoff.py'
      - 'scripts/package-ubuntu-boot-handoff.py'
      - 'scripts/collect-ubuntu-handoff.py.in'
      - 'tools/windows/*AVVIO-UBUNTU-3*'
      - 'tools/windows/RIPRISTINA-TEST-AVVIO-2.cmd'
      - 'tests/test_ubuntu_image_preservation.py'
      - '.github/workflows/ubuntu-boot-handoff.yml'
      - '.github/workflows/repackage-ubuntu-boot-handoff.yml'
permissions:
  contents: read
  actions: read
jobs:
  images:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the ARM64 test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential qemu-user
      - name: Obtain the exact successful image job and revalidate its source and runtime helpers
        env:
          UT_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/early_boot_diagnostic.py inputs
          python3 scripts/repackage_ubuntu_boot_handoff.py inputs
          python3 scripts/audit_kernel_boot_sources.py
          python3 scripts/repackage_ubuntu_boot_handoff.py force-source
          python3 tests/test_ubuntu_image_preservation.py --images out/ubuntu-boot-handoff-images
          python3 tests/test_ubuntu_boot_handoff.py --images out/ubuntu-boot-handoff-images --qemu qemu-aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beyond2lte-ubuntu-boot-handoff-images
          path: out/ubuntu-boot-handoff-images/
          if-no-files-found: error
  windows:
    needs: images
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Obtain the validated images and established portable tools
        shell: powershell
        env:
          UT_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python scripts/ubuntu_boot_handoff.py images
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/early_boot_diagnostic.py inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_boot_update.py inputs --out out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-ubuntu-install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-ubuntu-boot-handoff.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Merge into the established tools at a path with spaces
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root=[IO.Path]::GetFullPath('out/BOOT Ubuntu 3 with spaces')
          [IO.Compression.ZipFile]::ExtractToDirectory([IO.Path]::GetFullPath('out/UbuntuTouch-S10plus-installa-Ubuntu-Windows.zip'),$root)
          $zip=[IO.Compression.ZipFile]::OpenRead([IO.Path]::GetFullPath('out/UbuntuTouch-S10plus-avvio-Ubuntu-3-Windows.zip'))
          try {
            foreach ($entry in $zip.Entries) {
              $destination=Join-Path $root $entry.FullName
              [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($destination)) | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,$destination,$true)
            }
          } finally { $zip.Dispose() }
      - name: Test Windows 5.1 apply/restore guards and native CMD entry points
        shell: powershell
        run: .\out\test-ubuntu-handoff.generated.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beyond2lte-ubuntu-boot-handoff-windows
          path: |
            out/UbuntuTouch-S10plus-avvio-Ubuntu-3-Windows.zip
            out/ubuntu-handoff-artifact-reference.json
          if-no-files-found: error
